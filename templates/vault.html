<!DOCTYPE html>
<html>
<head>
    <title>My Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1 text-info">PyVault Dashboard</span>
        <div class="text-white">Logged in as: <strong>{{ user }}</strong> | <a href="/logout" class="btn btn-sm btn-danger">Logout</a></div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Add New Password</h5>
                    <form action="/add" method="POST">
                        <input type="text" name="site" class="form-control mb-2" placeholder="Website" required>
                        <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
                        <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
                        <button class="btn btn-info w-100">Save Securely</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <table class="table table-hover bg-white shadow-sm rounded">
                    <thead class="table-info">
                        <tr><th>Site</th><th>Username</th><th>Password</th></tr>
                    </thead>
                    <tbody>
                        {% for c in creds %}
                        <tr>
                            <td>{{ c.site }}</td>
                            <td>{{ c.user }}</td>
                            <td><code class="text-dark">{{ c.pwd }}</code></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
