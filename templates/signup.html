<!DOCTYPE html>
<html>
<head>
    <title>PyVault | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center" style="margin-top: 100px;">
        <div class="card shadow p-4" style="width: 400px;">
            <h2 class="text-center mb-4 text-success">Create Account</h2>
            {% with messages = get_flashed_messages() %}{% if messages %}
                <div class="alert alert-warning">{{ messages[0] }}</div>
            {% endif %}{% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Choose Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Create Master Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>
</body>
</html>
